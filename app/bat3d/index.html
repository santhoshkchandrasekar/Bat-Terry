<title>Terry the Bat (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f5; --ink: #131a24; --muted: #4d5b6b; --line: #c9d0da; --btn: #131a24; --btn-ink: #f4f6f9;
  --sky-a: #dfe8f4; --sky-b: #f4ecef; --sky-c: #fbe9d6; --bark: #4a3628; --bark-hi: #6b4f3b; --bark-lo: #2c1f17; --leaf: #6f8a5e;
  --display: "Fraunces", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1018; --ink: #e9eef5; --muted: #9aa8b8; --line: #243041; --btn: #e9eef5; --btn-ink: #0b1018;
  --sky-a: #0b1730; --sky-b: #1a2a4d; --sky-c: #3b3a5e; --bark: #2b1f18; --bark-hi: #43322a; --bark-lo: #150e0a; --leaf: #2f4030; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1018; --ink: #e9eef5; --muted: #9aa8b8; --line: #243041; --btn: #e9eef5; --btn-ink: #0b1018;
  --sky-a: #0b1730; --sky-b: #1a2a4d; --sky-c: #3b3a5e; --bark: #2b1f18; --bark-hi: #43322a; --bark-lo: #150e0a; --leaf: #2f4030; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--body); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 40px; display: grid; gap: 18px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 800 clamp(28px, 4vw, 40px)/1.05 var(--display); margin: 0; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 52ch; }
.stage { position: relative; height: 460px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 70% 0%, var(--sky-c), transparent 60%), linear-gradient(180deg, var(--sky-a), var(--sky-b)); }
.stage svg.branch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 500 14px/1 var(--body); padding: 11px 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; transition: background .15s, transform .1s; }
button:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
button:active { transform: translateY(1px); }
button.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
button:focus-visible { outline: 3px solid #3a7bd5; outline-offset: 2px; }
.sp { flex: 1; }
.state { font-size: 13px; color: var(--muted); min-width: 9ch; }
.err { display: none; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
@media (max-width: 640px) { .stage { height: 380px; } }
</style>
<div class="wrap">
  <header>
    <div>
      <h1>Terry, in 3D</h1>
      <p class="sub">A procedural three.js bat: furred body, bone-and-membrane wings, real flap, flip and roost.</p>
    </div>
    <div class="bar"><span class="state" id="state" aria-live="polite">hover</span><button id="b-theme" aria-pressed="false">Dark</button></div>
  </header>
  <div class="stage" id="stage" role="img" aria-label="A black bat named Terry flapping beside a branch">
    <svg class="branch" id="branch" viewBox="0 0 1000 460" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>
  <div class="bar" role="group" aria-label="Terry's moves">
    <button class="primary" id="b-flip">Flip &amp; hang</button>
    <button id="b-fly">Fly</button>
    <button id="b-flap">Flap</button>
    <button id="b-echo">Echolocate</button>
    <button id="b-now">Hang now</button>
    <span class="sp"></span>
    <label class="state" for="speed">Speed</label>
    <input id="speed" type="range" min="0.4" max="1.6" step="0.1" value="1" aria-label="Animation speed">
  </div>
  <div class="err" id="err">3D could not start here (WebGL is unavailable).</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="terry-bat3d.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const stage = $("stage");
  // the branch (drawn in the same pixel space as the 3D scene; x,y are stage pixels)
  function drawBranch() {
    const w = stage.clientWidth, h = stage.clientHeight, bx = Math.round(w * 0.7), by = 104;
    const svg = $("branch"); svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    svg.innerHTML = `
      <defs><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bark-hi)"/><stop offset=".55" stop-color="var(--bark)"/><stop offset="1" stop-color="var(--bark-lo)"/></linearGradient></defs>
      <path d="M-20 ${by - 20} C ${w * 0.25} ${by - 34}, ${w * 0.55} ${by - 10}, ${w + 20} ${by - 22} L ${w + 20} ${by + 2} C ${w * 0.55} ${by + 6}, ${w * 0.25} ${by - 8}, -20 ${by + 2} Z" fill="url(#bk)"/>
      <path d="M${bx - 150} ${by - 14} q 70 -30 160 -62" stroke="var(--bark)" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="var(--leaf)" opacity=".85"><ellipse cx="${bx - 62}" cy="${by - 70}" rx="22" ry="9" transform="rotate(-30 ${bx - 62} ${by - 70})"/><ellipse cx="${bx - 24}" cy="${by - 86}" rx="20" ry="8" transform="rotate(-10 ${bx - 24} ${by - 86})"/><ellipse cx="${bx + 12}" cy="${by - 84}" rx="17" ry="7" transform="rotate(25 ${bx + 12} ${by - 84})"/></g>
      <path d="M0 ${by - 8} C ${w * 0.3} ${by - 22}, ${w * 0.6} ${by - 4}, ${w} ${by - 14}" stroke="rgba(255,255,255,.15)" stroke-width="2" fill="none"/>`;
    return { bx, by: by + 4 };
  }
  let bat = null;
  function place() {
    const w = stage.clientWidth, h = stage.clientHeight, b = drawBranch();
    if (bat) { bat.setHome(w * 0.34, h * 0.56); bat.setBranch(b.bx, b.by); }
    return { w, h, b };
  }
  const p = place();
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  try {
    bat = TerryBat3D.create(stage, {
      scale: 1.45,
      home: { x: p.w * 0.34, y: p.h * 0.56 }, branch: { x: p.b.bx, y: p.b.by },
      flyCenter: { x: p.w * 0.5, y: p.h * 0.58 }, flyRadius: { x: p.w * 0.2, y: p.h * 0.12 },
      theme: document.documentElement.dataset.theme || "auto",
      onState: m => { $("state").textContent = m; },
    });
  } catch (e) { $("err").style.display = "block"; stage.style.display = "none"; console.error(e); }
  if (bat) {
    window.bat = bat;
    new ResizeObserver(() => { const q = place(); bat.setHome(q.w * 0.34, q.h * 0.56); bat.setBranch(q.b.bx, q.b.by); }).observe(stage);
    const act = (id, fn) => $(id).addEventListener("click", () => { fn(); setTimeout(() => $("state").textContent = bat.mode(), 60); });
    act("b-flip", () => bat.flip()); act("b-fly", () => bat.fly()); act("b-flap", () => bat.flap()); act("b-echo", () => bat.echo()); act("b-now", () => bat.hangNow());
    $("speed").addEventListener("input", e => bat.setSpeed(+e.target.value));
    $("b-theme").addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme !== "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light"; $("b-theme").textContent = dark ? "Light" : "Dark"; $("b-theme").setAttribute("aria-pressed", dark);
      bat.setTheme(dark ? "dark" : "light");
    });
    if (document.documentElement.dataset.theme === "dark") { $("b-theme").textContent = "Light"; }
    if (reduced) { bat.hangNow(); $("state").textContent = "hang"; ["b-fly", "b-flap", "b-flip"].forEach(i => $(i).disabled = true); }
    setInterval(() => { if (!document.hidden) $("state").textContent = bat.mode(); }, 400);
  }
})();
</script>
